<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="alternate icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/app-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#060911" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="description" content="PAVATI OS — Enterprise Point of Sale &amp; Inventory Management Suite" />
    <link rel="manifest" href="/manifest.json" />
    <title>PAVATI OS — Point of Sale</title>
    <script>
      // Automatically clean up any stale legacy Service Workers from previous versions
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(registrations) {
          for (var registration of registrations) {
            registration.unregister();
          }
        });
      }
      // Guarantee initial load switches to the state-of-the-art Midnight Obsidian theme
      try {
        if (!localStorage.getItem('pos_theme_v10_dark_enforce')) {
          localStorage.setItem('pos_theme', 'dark');
          localStorage.setItem('pos_theme_v10_dark_enforce', 'true');
        }
        var currentTheme = localStorage.getItem('pos_theme') || 'dark';
        document.documentElement.setAttribute('data-theme', currentTheme);
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'dark');
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
