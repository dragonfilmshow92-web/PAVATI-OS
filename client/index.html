    <script>
      // Register Service Worker for PWA (Android, iOS, Windows, and Mac)
      if ('serviceWorker' in navigator && window.location.protocol.startsWith('http')) {
        window.addEventListener('load', function() {
          navigator.serviceWorker.register('/sw.js').catch(function(err) {
            console.log('PWA Service Worker registration skipped:', err);
          });
        });
      }

      // Capture beforeinstallprompt for in-app install buttons
      window.deferredInstallPrompt = null;
      window.addEventListener('beforeinstallprompt', function(e) {
        e.preventDefault();
        window.deferredInstallPrompt = e;
        window.dispatchEvent(new CustomEvent('pwa-install-ready'));
      });

      // Guarantee initial load switches to Midnight Obsidian theme
      try {
        if (!localStorage.getItem('pos_theme_v10_dark_enforce')) {
          localStorage.setItem('pos_theme', 'dark');
          localStorage.setItem('pos_theme_v10_dark_enforce', 'true');
        }
        var currentTheme = localStorage.getItem('pos_theme') || 'dark';
        document.documentElement.setAttribute('data-theme', currentTheme);
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'dark');
      }
    </script>
