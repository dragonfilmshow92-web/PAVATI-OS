<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="50%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Background Rounded Squircle -->
  <rect x="24" y="24" width="464" height="464" rx="100" fill="url(#grad)" filter="url(#shadow)" />
  
  <!-- Subtle inner border -->
  <rect x="28" y="28" width="456" height="456" rx="96" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="4" />

  <!-- Shopping Cart Icon -->
  <g fill="none" stroke="#ffffff" stroke-width="26" stroke-linecap="round" stroke-linejoin="round">
    <!-- Cart handle and body -->
    <path d="M 120 160 L 170 160 L 215 310 L 375 310 L 410 195 L 180 195" />
    
    <!-- Cart wheels -->
    <circle cx="230" cy="370" r="22" fill="#ffffff" stroke="none" />
    <circle cx="360" cy="370" r="22" fill="#ffffff" stroke="none" />
  </g>

  <!-- Supermarket Lightning Bolt in Cart -->
  <path d="M 305 130 L 245 225 L 295 225 L 265 310 L 350 195 L 300 195 Z" fill="url(#gold)" stroke="#ffffff" stroke-width="6" stroke-linejoin="round" />
</svg>
